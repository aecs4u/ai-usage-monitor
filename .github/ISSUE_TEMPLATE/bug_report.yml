name: Bug report
description: Report a problem or regression
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the details below.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What happened? Provide a clear and concise summary.
      placeholder: Example: Daily report crashes when --tool all is used
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands and inputs.
      placeholder: |
        1. Run ai-usage-monitor --view daily --tool all
        2. Observe error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs (redact secrets).
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of ai-usage-monitor --version
      placeholder: Example: 4.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python
      description: Example: macOS 14 / Python 3.11
      placeholder: Example: Ubuntu 22.04 / Python 3.12
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help.
    validations:
      required: false
