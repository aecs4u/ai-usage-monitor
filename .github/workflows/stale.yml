name: Mark stale issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue settings
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,good first issue,help wanted'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 14 days if no further activity occurs.

            If this issue is still relevant, please:
            - Comment to keep it open
            - Add new information
            - Provide updates on progress

            Thank you for your contributions! 🙏
          close-issue-message: |
            This issue was automatically closed due to inactivity.

            If this is still relevant, please feel free to reopen it or create a new issue
            with updated information.

          # PR settings
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,work in progress'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.

            If you're still working on this:
            - Push new commits
            - Comment with an update
            - Request a review

            Thanks for your contribution! 🚀
          close-pr-message: |
            This pull request was automatically closed due to inactivity.

            If you'd like to continue this work, please feel free to reopen it or
            create a new PR.

          # Behavior settings
          ascending: true
          operations-per-run: 100
          remove-stale-when-updated: true
