name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome first-time contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Thanks for opening your first issue! We're excited to have you as part of the community.

            A maintainer will review your issue soon. In the meantime:
            - Check out our [Contributing Guide](../CONTRIBUTING.md)
            - Browse our [Documentation](../docs/)
            - Join the [Discussions](../../discussions) if you have questions

            We appreciate your contribution! 🎉
          pr-message: |
            🎉 Thanks for opening your first pull request! We're thrilled to have you contributing.

            A maintainer will review your PR soon. Please make sure:
            - [ ] Tests pass (`pytest src/tests/`)
            - [ ] Code follows our style guidelines
            - [ ] Documentation is updated if needed
            - [ ] CHANGELOG.md is updated (if applicable)

            Check out our [Contributing Guide](../CONTRIBUTING.md) for more details.

            Thanks for making AI Usage Monitor better! 🚀
