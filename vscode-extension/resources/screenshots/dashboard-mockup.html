<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Monitor - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
            padding: 0;
            margin: 0;
        }

        .dashboard-container {
            width: 1200px;
            height: 900px;
            background: #1e1e1e;
            padding: 40px;
            overflow-y: auto;
        }

        .dashboard-header {
            margin-bottom: 40px;
        }

        .dashboard-header h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .dashboard-header p {
            color: #888888;
            font-size: 14px;
        }

        .dashboard-header .actions {
            margin-top: 16px;
        }

        .btn {
            background: #0e639c;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 13px;
            font-family: inherit;
        }

        .btn:hover {
            background: #1177bb;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #252526;
            padding: 24px;
            border-radius: 4px;
            border: 1px solid #3c3c3c;
        }

        .chart-container h2 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .chart-container canvas {
            max-height: 250px;
        }

        .chart-container.full-width {
            grid-column: 1 / -1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #252526;
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #3c3c3c;
            border-left: 3px solid #007acc;
        }

        .stat-card h3 {
            color: #888888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-card .value {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-card .subtext {
            color: #888888;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>📊 AI Usage Dashboard</h1>
            <p>Comprehensive view of your AI coding assistant usage</p>
            <div class="actions">
                <button class="btn">🔄 Refresh</button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Tokens</h3>
                <div class="value">1.2M</div>
                <div class="subtext">This month</div>
            </div>
            <div class="stat-card" style="border-left-color: #22c55e;">
                <h3>Total Cost</h3>
                <div class="value">$45.67</div>
                <div class="subtext">This month</div>
            </div>
            <div class="stat-card" style="border-left-color: #f59e0b;">
                <h3>Avg Daily</h3>
                <div class="value">52.1K</div>
                <div class="subtext">Tokens per day</div>
            </div>
            <div class="stat-card" style="border-left-color: #8b5cf6;">
                <h3>Sessions</h3>
                <div class="value">127</div>
                <div class="subtext">This month</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="chart-grid">
            <div class="chart-container">
                <h2>Daily Token Usage (Last 14 Days)</h2>
                <canvas id="dailyTokensChart"></canvas>
            </div>

            <div class="chart-container">
                <h2>Daily Costs (Last 14 Days)</h2>
                <canvas id="dailyCostsChart"></canvas>
            </div>

            <div class="chart-container full-width">
                <h2>Monthly Token Usage</h2>
                <canvas id="monthlyTokensChart"></canvas>
            </div>

            <div class="chart-container full-width">
                <h2>Monthly Costs</h2>
                <canvas id="monthlyCostsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
                legend: {
                    labels: {
                        color: '#cccccc',
                        font: {
                            size: 12
                        }
                    }
                }
            },
            scales: {
                y: {
                    ticks: {
                        color: '#cccccc'
                    },
                    grid: {
                        color: '#3c3c3c'
                    }
                },
                x: {
                    ticks: {
                        color: '#cccccc'
                    },
                    grid: {
                        color: '#3c3c3c'
                    }
                }
            }
        };

        // Daily Tokens Chart
        new Chart(document.getElementById('dailyTokensChart'), {
            type: 'line',
            data: {
                labels: ['Jan 10', 'Jan 11', 'Jan 12', 'Jan 13', 'Jan 14', 'Jan 15', 'Jan 16', 'Jan 17', 'Jan 18', 'Jan 19', 'Jan 20', 'Jan 21', 'Jan 22', 'Jan 23'],
                datasets: [{
                    label: 'Total Tokens',
                    data: [45000, 52000, 48000, 61000, 55000, 59000, 63000, 58000, 67000, 61000, 70000, 65000, 72000, 68000],
                    borderColor: '#007acc',
                    backgroundColor: 'rgba(0, 122, 204, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: chartOptions
        });

        // Daily Costs Chart
        new Chart(document.getElementById('dailyCostsChart'), {
            type: 'bar',
            data: {
                labels: ['Jan 10', 'Jan 11', 'Jan 12', 'Jan 13', 'Jan 14', 'Jan 15', 'Jan 16', 'Jan 17', 'Jan 18', 'Jan 19', 'Jan 20', 'Jan 21', 'Jan 22', 'Jan 23'],
                datasets: [{
                    label: 'Cost ($)',
                    data: [1.8, 2.1, 1.9, 2.4, 2.2, 2.4, 2.5, 2.3, 2.7, 2.4, 2.8, 2.6, 2.9, 2.7],
                    backgroundColor: '#22c55e',
                    borderColor: '#16a34a',
                    borderWidth: 1
                }]
            },
            options: chartOptions
        });

        // Monthly Tokens Chart
        new Chart(document.getElementById('monthlyTokensChart'), {
            type: 'bar',
            data: {
                labels: ['September 2025', 'October 2025', 'November 2025', 'December 2025', 'January 2026'],
                datasets: [{
                    label: 'Total Tokens',
                    data: [850000, 920000, 1050000, 980000, 1200000],
                    backgroundColor: '#8b5cf6',
                    borderColor: '#7c3aed',
                    borderWidth: 1
                }]
            },
            options: chartOptions
        });

        // Monthly Costs Chart
        new Chart(document.getElementById('monthlyCostsChart'), {
            type: 'line',
            data: {
                labels: ['September 2025', 'October 2025', 'November 2025', 'December 2025', 'January 2026'],
                datasets: [{
                    label: 'Cost ($)',
                    data: [34.50, 37.20, 42.80, 38.90, 45.67],
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: chartOptions
        });
    </script>
</body>
</html>
